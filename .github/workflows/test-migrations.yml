name: Test migrations

on:
  push:
    branches: [main]
    paths: &migration-paths
      - alembic/**
      - alembic.ini
      - db/**
      - scripts/test_migrations.sh
      - scripts/check_models.py
      - app/**
      - Makefile
      - setup/env.example
      - pyproject.toml
      - .github/workflows/test-migrations.yml
  pull_request:
    paths: *migration-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # uv.lock is deliberately not committed, so resolve from pyproject.toml.
      # The default cache key already hashes pyproject.toml.
      - name: Install dependencies
        run: uv sync

      # No .env in CI: the script falls back to setup/env.example
      - name: Run make test-migrations
        run: make test-migrations
